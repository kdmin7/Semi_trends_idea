<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiAnalysis 분석리포트</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#16a34a',
              600: '#15803d',
              700: '#166534',
              800: '#14532d'
            },
            dark: {
              bg: '#080c14',
              card: '#111827',
              border: '#1f2937',
              hover: '#1e293b'
            }
          },
          fontFamily: {
            sans: ['Pretendard Variable', 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'sans-serif'],
            mono: ['Pretendard Variable', 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'sans-serif']
          }
        }
      }
    };
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@1.52.0"></script>
  <!-- 폰트: Pretendard Variable (본문·보조·한글 전부), 자간 -0.02em -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <style>
    /* 전체 폰트 Pretendard + 자간 -0.02em (Tailwind tracking-* 유틸리티도 같은 값으로 통일) */
    html, body { font-family: 'Pretendard Variable', 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    *, *::before, *::after { letter-spacing: -0.02em !important; }
    /* Full HD 1920 최적화 및 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #374151;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .glassmorphism {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ===== Full HD 3분할 게시판 (사이드바 / 목록 / 상세 패널) ===== */
    :root {
      --bg: #f8fafc; --panel: #ffffff; --line: #e2e8f0; --hover: #f1f5f9; --sel: #ecfdf5;
      --text: #0f172a; --sub: #334155; --muted: #64748b; --accent: #059669; --accent-bg: #d1fae5;
      --warn: #b45309; --warn-bg: #fef3c7;
      --glow-a: rgba(5,150,105,.12); --glow-b: rgba(5,150,105,.35);
    }
    html.dark {
      --bg: #0b1120; --panel: #111827; --line: #1f2937; --hover: #172033; --sel: #0f2a24;
      --text: #f1f5f9; --sub: #cbd5e1; --muted: #94a3b8; --accent: #34d399; --accent-bg: #064e3b;
      --warn: #fbbf24; --warn-bg: #3a2a08;
      --glow-a: rgba(52,211,153,.14); --glow-b: rgba(52,211,153,.45);
    }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      flex: none; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px;
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .topbar h1 { font-size: 20px; font-weight: 800; margin: 0; white-space: nowrap; }
    .topbar .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
    .search {
      margin-left: auto; width: 360px; padding: 8px 14px; font-size: 14px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .reset { padding: 5px 12px; font-size: 14px; font-weight: 600; border: 1px solid var(--accent); border-radius: 999px; background: var(--accent-bg); color: var(--accent); cursor: pointer; white-space: nowrap; }
    .hbtn { padding: 7px 14px; font-size: 14px; font-weight: 600; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
    .hbtn:hover { border-color: var(--accent); color: var(--accent); }
    .hbtn.on { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
    .hbtn.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .hbtn.solid:hover { opacity: .9; color: #fff; }

    .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 240px 640px minmax(0, 1fr); }
    .pane { min-height: 0; overflow-y: auto; }

    /* 1) 좌측 필터 */
    nav { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 12px; }
    nav h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 12px 8px; text-transform: uppercase; }
    .cat {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      padding: 10px 12px; border: 0; border-radius: 8px; background: none; cursor: pointer;
      font-size: 17px; color: var(--sub); text-align: left;
    }
    .cat:hover { background: var(--hover); }
    .cat.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
    .cat .n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cat.subcat { padding: 7px 12px 7px 28px; font-size: 16px; }
    .cat.subcat.on { background: transparent; color: var(--accent); }
    .zero { opacity: .4; }
    .n i { font-style: normal; color: var(--muted); font-weight: 400; margin-left: 1px; }
    .yrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 8px; }
    .yr { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 48px; border: 1px solid var(--line); background: none; border-radius: 8px; font-size: 14px; line-height: 1.2; color: var(--sub); cursor: pointer; }
    .yr small { margin-top: 2px; font-size: 12px; color: var(--muted); }
    .yr.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
    nav .sep { height: 1px; background: var(--line); margin: 16px 12px; }

    /* 2) 중앙 목록 */
    .list { background: var(--panel); border-right: 1px solid var(--line); }
    .row {
      display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; cursor: pointer;
      padding: 14px 12px 14px 20px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent;
    }
    .row:hover { background: var(--hover); }
    .row.on { background: var(--sel); border-left-color: var(--accent); }
    .row .main { flex: 1; min-width: 0; }
    .row .t {
      font-size: 16px; font-weight: 600; line-height: 1.45; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .row .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
    .row .bm { flex: none; border: 0; background: none; cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 6px; color: var(--muted); }
    .row .bm:hover, .row .bm.on { color: #f59e0b; }
    .tag { padding: 1px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); font-weight: 600; font-size: 12px; white-space: nowrap; }
    .tag.paid { background: var(--warn-bg); color: var(--warn); }
    .tag.new { background: var(--accent); color: #fff; }
    /* 최신 글(7일 이내·미읽음) 글로우 박스 */
    .row.fresh {
      background: linear-gradient(90deg, var(--glow-a), transparent 70%);
      border-left-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--glow-b), inset 0 0 22px var(--glow-a);
      animation: breathe 3.2s ease-in-out infinite;
    }
    .row.fresh.on { border-left-width: 5px; }
    @keyframes breathe {
      0%, 100% { box-shadow: inset 0 0 0 1px var(--glow-b), inset 0 0 14px var(--glow-a); }
      50% { box-shadow: inset 0 0 0 1px var(--accent), inset 0 0 30px var(--glow-b); }
    }
    @media (prefers-reduced-motion: reduce) { .row.fresh { animation: none; } }
    .row.read .t { color: var(--muted); font-weight: 500; }
    .more { display: block; margin: 16px auto; padding: 8px 20px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
    .none { padding: 64px 24px; text-align: center; color: var(--muted); }
    .none strong { display: block; font-size: 18px; color: var(--text); margin-bottom: 6px; }

    /* 3) 우측 상세 패널 */
    .detail { padding: 36px 48px 80px; }
    .detail .inner { max-width: 880px; margin: 0 auto; }
    .dmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
    .dtitle { font-size: 30px; line-height: 1.35; font-weight: 800; margin: 12px 0 4px; color: var(--text); }
    .dsub { font-size: 18px; line-height: 1.5; font-weight: 500; color: var(--muted); margin: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 18px; }
    .tabsbar { position: sticky; top: -36px; z-index: 10; background: var(--bg); padding-top: 8px; }
    .empty { color: var(--muted); text-align: center; margin-top: 30vh; font-size: 16px; }

    /* Full HD 미만에서는 좌측 필터를 숨기고 목록·상세를 우선 보존 */
    @media (max-width: 1500px) { .body { grid-template-columns: 560px minmax(0, 1fr); } nav { display: none; } }
  </style>
</head>
<body class="font-sans antialiased selection:bg-emerald-500 selection:text-white">
<div class="app">
  <header class="topbar">
    <h1>SemiAnalysis 분석리포트</h1>
    <span class="count" id="count"></span>
    <button class="reset hidden" id="resetBtn" type="button" onclick="resetAllFilters()">✕ 필터 초기화</button>
    <input class="search" id="searchInput" type="search" oninput="handleSearch(this.value)" placeholder="제목·요약·키워드 검색  ( / )">
    <button id="bookmarkFilterBtn" class="hbtn" type="button" onclick="toggleBookmarkOnlyFilter()">★ 북마크 (<span id="bookmarkCount">0</span>)</button>
    <button class="hbtn solid" type="button" onclick="exportMarkdownSummary()">MD 내보내기</button>
    <button id="themeToggleBtn" class="hbtn" type="button" onclick="toggleTheme()" title="라이트/다크 모드 전환"></button>
  </header>

  <div id="dataError" class="hidden m-4 p-4 rounded-2xl border border-rose-300 bg-rose-50 text-sm text-rose-800 font-medium">
    데이터를 불러오지 못했습니다. <code>assets/data.js</code>가 있는지 확인하고, 없으면 <code>python build_site.py</code>를 실행하세요.
  </div>

  <div class="body">
    <nav class="pane" id="nav"></nav>
    <section class="pane list" id="list"></section>
    <main class="pane detail" id="detailPane">
      <p id="detailEmpty" class="empty">왼쪽 목록에서 리포트를 선택하세요</p>
      <div id="detailView" class="inner hidden">
        <div class="dmeta">
          <span id="modalCategory" class="tag"></span>
          <span id="modalAccessBadge" class="tag paid"></span>
          <span id="modalEvidenceBadge" class="tag"></span>
          <span id="modalDate"></span>
        </div>
        <h2 id="modalTitle" class="dtitle"></h2>
        <p id="modalTitleEn" class="dsub hidden"></p>

        <div class="actions">
          <button id="modalBookmarkBtn" onclick="toggleModalBookmark()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-300 dark:border-dark-border hover:border-slate-400 bg-white dark:bg-dark-card text-slate-700 dark:text-slate-300 shadow-sm transition">
            <i data-lucide="bookmark" class="w-4 h-4"></i>
            <span id="modalBookmarkLabel">북마크 추가</span>
          </button>
          <button id="modalWordBtn" onclick="downloadModalWord()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-300 dark:border-dark-border hover:border-slate-400 bg-white dark:bg-dark-card text-slate-700 dark:text-slate-300 shadow-sm transition" title="현재 리포트를 Word 문서(.docx)로 저장">
            <i data-lucide="file-down" class="w-4 h-4"></i>
            <span>Word 다운로드</span>
          </button>
          <a id="modalExternalLink" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition shadow-md shadow-emerald-600/30">
            <span>Substack 원문 읽기</span>
            <i data-lucide="external-link" class="w-4 h-4"></i>
          </a>
        </div>

        <!-- 상세 탭 바: 글별 요약 JSON이 로드된 경우에만 표시 -->
        <div id="modalTabs" role="tablist" class="tabsbar hidden gap-1 border-b border-slate-200 dark:border-dark-border">
          <button role="tab" data-tab="overview" onclick="setModalTab('overview')" class="modal-tab px-5 py-3 text-base font-bold border-b-2 -mb-px transition">개요</button>
          <button role="tab" data-tab="detail" onclick="setModalTab('detail')" class="modal-tab px-5 py-3 text-base font-bold border-b-2 -mb-px transition">상세</button>
          <button role="tab" data-tab="ref" onclick="setModalTab('ref')" class="modal-tab px-5 py-3 text-base font-bold border-b-2 -mb-px transition">참고</button>
        </div>

      <!-- 모달 본문 (심층 보고서) -->
      <div id="modalBody" class="space-y-7 text-base pt-6">

        <!-- 상세 패널: 1~10번 항목 (요약 JSON 로드 후 렌더) -->
        <div id="modalDetail" class="hidden"></div>

        <!-- 기본 보기(요약 JSON이 없거나 로드 전) -->
        <div id="modalLegacy" class="space-y-7">
        <!-- 1. 핵심 포인트 -->
        <div id="modalInsightBox" class="bg-emerald-50/80 dark:bg-gradient-to-r dark:from-emerald-950/40 dark:via-dark-bg dark:to-dark-card border border-emerald-300 dark:border-emerald-500/30 rounded-2xl p-6 shadow-inner">
          <div class="flex items-center justify-between mb-3">
            <h4 class="text-sm sm:text-base font-bold text-emerald-800 dark:text-emerald-400 uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i>
              핵심 포인트
            </h4>
            <span id="modalInsightEvidence" class="text-xs font-mono px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-300 font-semibold"></span>
          </div>
          <ul id="modalInsightList" class="space-y-3 text-slate-800 dark:text-slate-200 text-sm sm:text-base leading-relaxed">
            <!-- 서술형 개조식 불릿 주입 -->
          </ul>
        </div>

        <!-- 2. Executive Summary -->
        <div class="space-y-2.5">
          <h4 class="text-sm sm:text-base font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="file-text" class="w-4 h-4 text-emerald-600 dark:text-emerald-400"></i>
            요약
          </h4>
          <div id="modalExecutiveSummary" class="text-slate-700 dark:text-slate-300 leading-relaxed bg-slate-50 dark:bg-dark-bg/60 p-6 rounded-2xl border border-slate-200 dark:border-dark-border/80 whitespace-pre-line text-sm sm:text-base"></div>
        </div>

        <!-- 4. 한 줄 요점 -->
        <div id="modalConclusionBox" class="space-y-2.5">
          <h4 class="text-sm sm:text-base font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="compass" class="w-4 h-4 text-purple-600 dark:text-purple-400"></i>
            한 줄 요점 (Takeaway)
          </h4>
          <div id="modalConclusion" class="text-slate-700 dark:text-slate-300 leading-relaxed bg-slate-50 dark:bg-dark-bg/60 p-6 rounded-2xl border border-slate-200 dark:border-dark-border/80 whitespace-pre-line text-sm sm:text-base"></div>
        </div>

        </div>

        <!-- 태그 리스트 -->
        <div>
          <h4 class="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2.5">분석 기술 키워드 (Tags)</h4>
          <div id="modalTags" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- 원문 링크 복사 바 -->
        <div>
          <h4 class="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2.5">원문 URL 정보</h4>
          <div class="flex items-center gap-2.5 p-3.5 rounded-xl bg-slate-50 dark:bg-dark-bg/50 border border-slate-200 dark:border-dark-border">
            <i data-lucide="link" class="w-4 h-4 text-emerald-600 dark:text-emerald-400 flex-shrink-0"></i>
            <span id="modalUrlText" class="font-mono text-xs sm:text-sm text-slate-700 dark:text-slate-300 truncate select-all"></span>
            <button onclick="copyModalUrl()" class="ml-auto p-1.5 hover:bg-slate-200 dark:hover:bg-dark-border rounded-lg text-slate-500 hover:text-emerald-600 transition" title="URL 복사">
              <i data-lucide="copy" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
      </div>
    </main>
  </div>
</div>

  <!-- 비침습적 토스트 알림 (alert 대체) -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm transition-all border border-slate-700">
    <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
    <span id="toastMsg">복사되었습니다.</span>
  </div>
  <!-- 파이프라인 산출 데이터 (scripts/build_data.py → assets/data.js, window.POSTS) -->
  <script src="assets/data.js"></script>
  <script>
    /* 데이터: assets/data.js 의 window.POSTS (scripts/build_data.py 가 생성) */
    const POSTS = Array.isArray(window.POSTS) ? window.POSTS : [];
    const USING_LIVE_DATA = POSTS.length > 0;
    const RAW_SOURCE_LINES = POSTS.map(p => p.url);
    const POST_BY_SLUG = {};
    POSTS.forEach(p => {
      const sl = (p.slug || (p.url || '').replace(/\/+$/, '').split('/').pop() || '').trim();
      if (sl && !POST_BY_SLUG[sl]) POST_BY_SLUG[sl] = p;
    });

    /* ==========================================================================
       3. 4대 핵심 기술 영역 정의 (카테고리 번호 삭제 및 ID 100% 동기화)
       ========================================================================== */
    const CATEGORIES = [
      { id: 'packaging-memory', name: '패키징·메모리' },
      { id: 'accelerator', name: '가속기' },
      { id: 'llm-economics', name: 'LLM 경제성' },
      { id: 'datacenter-infra', name: '데이터센터·인프라' },
      { id: 'strategy-geo', name: '전략·지정학' },
      { id: 'etc', name: '기타' }   // 어느 규칙에도 안 걸린 글
    ];
    /* URL 슬러그 정규화 */
    function extractSlug(raw) {
      if (!raw) return "";
      let s = raw.trim();
      s = s.replace(/^[<\[]/, '').replace(/[>\]]$/, '');
      if (s.includes('semianalysis.com/p/')) {
        s = s.split('semianalysis.com/p/')[1];
      }
      s = s.split(/[?#]/)[0].replace(/\/+$/, '').trim();
      return s;
    }

    /* 슬러그 타이틀 포맷터 (대괄호 날짜 접두사 미포함) */
    function formatTitleFromSlug(slug) {
      if (!slug) return "제목 미확인";
      const acronyms = {
        'ai': 'AI', 'gpu': 'GPU', 'gpus': 'GPUs', 'tpu': 'TPU', 'tpuv7': 'TPU v7', 'tpuv5e': 'TPU v5e',
        'hbm': 'HBM', 'hbm3e': 'HBM3e', 'hbm4': 'HBM4', 'cpo': 'CPO', 'cxl': 'CXL', 'llm': 'LLM',
        'nvl72': 'NVL72', 'gb200': 'GB200', 'gb300': 'GB300', 'b100': 'B100', 'b200': 'B200',
        'eda': 'EDA', 'tsmc': 'TSMC', 'smic': 'SMIC', 'cxmt': 'CXMT', 'euv': 'EUV', 'dram': 'DRAM',
        'nand': 'NAND', 'cpu': 'CPU', 'cpus': 'CPUs', 'tco': 'TCO', 'risc': 'RISC', 'rl': 'RL',
        'asml': 'ASML', 'iedm': 'IEDM', 'vlsi': 'VLSI', 'isscc': 'ISSCC', 'ectc': 'ECTC'
      };
      return slug.split('-').map(word => {
        const lower = word.toLowerCase();
        if (acronyms[lower]) return acronyms[lower];
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(' ');
    }

    /* 파이프라인 category 코드 → 대시보드 5대 영역 매핑 (큐레이션된 값 우선) */
    const CATEGORY_CODE_MAP = {
      mem: 'packaging-memory', chip: 'packaging-memory', acc: 'accelerator',
      model: 'llm-economics', dc: 'datacenter-infra', biz: 'strategy-geo'
    };

    /* 키워드 규칙: 위에서부터 먼저 일치하는 영역으로 분류 (슬러그 + 제목 텍스트 대상) */
    const CATEGORY_RULES = [
      { id: 'strategy-geo', re: /sanction|export[- ]control|tool[- ]ban|cold[- ]war|economic[- ]war|\bccp\b|arm[- ]china|chips[- ]act|evade|regionali[sz]ation|\bscam\b|\bheist\b|lose[- ]semiconductors|diffusion|\bipo\b|earnings|roundup|dividend|bear[- ]market|\buae\b|middle[- ]east|sovereign|소버린|수출|제재|규제/i },
      { id: 'packaging-memory', re: /\bhbm|memory|dram|nand|flash|3d[- ]x[- ]point|packaging|hybrid[- ]bonding|cowos|foundr|globalfoundries|\btsmc\b|\bsmic\b|\bcxmt\b|\bfabs?\b(?!ric)|wafer(?![- ]scale)|lithograph|\blitho\b|\beuv\b|high[- ]na|gate[- ]all[- ]around|backside[- ]power|\d+nm|silicon[- ]carbide|\bsic\b|reticle|transistor|moore|semiconductor[- ]manufacturing|capital[- ]equipment|\bkla\b|onto[- ]innovation|veeco|kulicke|kokusai|aehr|acm[- ]research|process[- ]control|\becrc|\bectc|\biedm|\bvlsi|\basml\b|\bdisco\b|메모리|패키징|파운드리|공정|오프로딩|\bhbm/i },
      { id: 'datacenter-infra', re: /datacenter|data[- ]center|\bgrid\b|\bpower\b|800vdc|cooling|infiniband|interconnect|co-?packaged|\bcpo\b|optical|photonic|\bocs\b|neocloud|clustermax|colossus|network|copper|water|ratepayer|moratorium|marvell|cables?\b|connectivity|astera|supermicro|\bdell\b|server|brackb|gigawatt|데이터센터|전력|네오클라우드|클러스터/i },
      { id: 'llm-economics', re: /\btokens?\b|inference|\brl\b|reinforcement|reasoning|deepseek|\bgpt|claude|gemini|sparse|quantization|\bllm\b|language[- ]model|transformer|coding[- ]assistant|open[- ]models?|model[- ]labs?|kimi|inferencemax|inferencex|agent|compiler|miscompile|on[- ]device|search[- ]architecture|brick[- ]wall|embedding|\bo1\b|추론|모델|토큰|컴파일러|강화학습|임베딩/i },
      { id: 'accelerator', re: /blackwell|rubin|nvidia|nvl72|\bgb[23]00|\bh100|\btpu|cerebras|trainium|\bmi[34]\d\d|\bgpu|tensor|accelerator|groq|chiplet|dojo|wormhole|tenstorrent|graphcore|rivos|risc-v|\bxeon|\bgenoa|emerald[- ]rapids|meteor[- ]lake|ampere|\bcxl\b|\bvpu|\bdpu|\basic\b|custom[- ]silicon|chip[- ]team|die[- ]shot|architecture|caliptra|\bhopper|\bamd\b|\bm2\b|\ba1[45]\b|ascend|가속기|엔비디아|세레브라스|cerebras|\bgpu/i }
    ];

    /* 소분류 키워드 규칙: 대분류별로 위에서부터 먼저 일치하는 항목, 없으면 '기타' */
    const SUBS = {
      'packaging-memory': [
        { name: '패키징', re: /packaging|hybrid[- ]bonding|cowos|\bectc|chiplet|패키징|오프로딩/i },
        { name: 'HBM·DRAM·NAND', re: /\bhbm|memory|dram|nand|flash|3d[- ]x[- ]point|메모리/i },
        { name: '파운드리·공정', re: /foundr|globalfoundries|\btsmc\b|\bsmic\b|\bcxmt\b|\bfabs?\b(?!ric)|wafer|lithograph|\blitho\b|\beuv\b|high[- ]na|gate[- ]all|backside|\d+nm|silicon[- ]carbide|\bsic\b|reticle|transistor|moore|capital[- ]equipment|\bkla\b|onto[- ]innovation|veeco|kulicke|kokusai|aehr|acm[- ]research|process[- ]control|\basml\b|\bdisco\b|파운드리|공정/i }
      ],
      'accelerator': [
        { name: 'NVIDIA', re: /blackwell|rubin|nvidia|nvl72|\bgb[23]00|\bh100|hopper|엔비디아/i },
        { name: 'AMD·커스텀 ASIC', re: /\btpu|trainium|\bmi[34]\d\d|\bamd\b|\basic\b|custom[- ]silicon|groq|cerebras|dojo|wormhole|tenstorrent|graphcore|rivos|ascend|세레브라스/i },
        { name: 'CPU·아키텍처', re: /xeon|genoa|emerald[- ]rapids|meteor[- ]lake|ampere|risc-v|\bm2\b|\ba1[45]\b|\bcxl\b|architecture|die[- ]shot|caliptra|\bvpu|\bdpu/i }
      ],
      'datacenter-infra': [
        { name: '전력·냉각', re: /\bgrid\b|\bpower\b|800vdc|cooling|\bwater\b|gigawatt|ratepayer|moratorium|전력/i },
        { name: '네트워크·광학', re: /infiniband|interconnect|co-?packaged|\bcpo\b|optical|photonic|\bocs\b|network|copper|cables?\b|connectivity|marvell|astera/i },
        { name: '클라우드·클러스터', re: /neocloud|clustermax|colossus|supermicro|\bdell\b|server|brackb|datacenter|data[- ]center|데이터센터|네오클라우드|클러스터/i }
      ],
      'llm-economics': [
        { name: '추론·토큰 경제', re: /\btokens?\b|inference|추론|토큰|sparse|quantization|on[- ]device|inferencemax|inferencex/i },
        { name: '모델·학습', re: /\brl\b|reinforcement|reasoning|deepseek|\bgpt|claude|gemini|kimi|\bllm\b|language[- ]model|transformer|open[- ]models?|model[- ]labs?|anthropic|openai|superintelligence|모델|강화학습/i },
        { name: 'AI 응용·로보틱스', re: /robot|autonomy|labor|automation|로봇/i },
        { name: '소프트웨어·에이전트', re: /agent|compiler|miscompile|coding[- ]assistant|embedding|search[- ]architecture|컴파일러|임베딩/i }
      ],
      'strategy-geo': [
        { name: '수출통제·제재', re: /sanction|export[- ]control|tool[- ]ban|chips[- ]act|evade|diffusion|arm[- ]china|수출|제재|규제/i },
        { name: '중국·지정학', re: /china|chinese|cold[- ]war|economic[- ]war|\bccp\b|\buae\b|middle[- ]east|sovereign|regionali[sz]ation|중국|소버린/i },
        { name: '시장·실적', re: /\bipo\b|earnings|roundup|dividend|bear[- ]market|\bscam\b|\bheist\b|lose[- ]semiconductors|oracle|compute[- ]market/i }
      ]
    };

    /* 카테고리 판별: 큐레이션 코드 → 대분류 키워드 규칙 → 소분류 키워드 → '기타'(etc) */
    function detectCategory(slug, extraText, code) {
      if (code && CATEGORY_CODE_MAP[code]) return CATEGORY_CODE_MAP[code];
      const text = ((slug || '').replace(/-/g, ' ') + ' ' + (extraText || '')).toLowerCase();
      for (const rule of CATEGORY_RULES) {
        if (rule.re.test(text)) return rule.id;
      }
      for (const [id, list] of Object.entries(SUBS)) {
        if (list.some(sb => sb.re.test(text))) return id;
      }
      return 'etc';
    }

    function detectSub(categoryId, slug, extraText) {
      const list = SUBS[categoryId];
      if (!list) return '';
      const text = ((slug || '').replace(/-/g, ' ') + ' ' + (extraText || '')).toLowerCase();
      const hit = list.find(sb => sb.re.test(text));
      return hit ? hit.name : '기타';
    }

    /* 리포트 구성: 파이프라인이 제공한 실제 데이터만 사용 (임의 생성 문장·수치 없음)
       - points / takeaway / entities : enrich 단계에서 큐레이션된 기사에만 존재
       - summary : 피드 요약 (모든 기사)                                                     */
    const EVIDENCE_LABELS = { curated: '큐레이션 요약', feed: '피드 요약' };

    function buildReport(slug, live) {
      const points = live && Array.isArray(live.points) ? live.points.filter(Boolean) : [];
      const entities = live && Array.isArray(live.entities) ? live.entities.filter(Boolean) : [];

      // 태그: 큐레이션 엔티티 우선 + 슬러그 키워드 (단독 특수문자·불용어 배제)
      const slugTags = slug.toLowerCase().split('-')
        .map(t => t.toUpperCase())
        .filter(t => t.length > 2 && !['THE', 'FOR', 'AND', 'WITH', 'FROM', 'INTO', 'THAT', 'THIS', 'HOW'].includes(t))
        .filter(t => !/^[&·\/\-_+]+$/.test(t));
      const tags = [...new Set([...entities.map(e => String(e)), ...slugTags])].slice(0, 6);

      return {
        insights: points,
        summary: (live && live.summary) || '요약 정보가 없습니다. 원문 링크를 확인하세요.',
        conclusion: (live && live.takeaway) || '',
        evidence: points.length ? 'curated' : 'feed',
        access: live ? (live.paywalled ? 'paywalled' : 'free') : 'unknown',
        tags
      };
    }
    /* 중복 제거 파이프라인 (313개 입력 -> 97건 중복 제외 -> 216개 고유 아티클 도출) */
    const DEDUPED_ARTICLES = [];
    const seenSlugs = new Set();
    let duplicateCount = 0;

    RAW_SOURCE_LINES.forEach(line => {
      const slug = extractSlug(line);
      if (!slug) return;
      if (seenSlugs.has(slug)) {
        duplicateCount++;
      } else {
        seenSlugs.add(slug);
        const live = POST_BY_SLUG[slug];
        const title = (live && (live.title_ko || live.title)) || formatTitleFromSlug(slug);
        const catText = live ? [live.title, live.title_ko].join(' ') : title;
        const categoryId = detectCategory(slug, catText, live && live.category);
        const subName = detectSub(categoryId, slug, catText);
        const livePubDate = live && live.published_at ? String(live.published_at).slice(0, 10) : null;
        const publishDate = livePubDate; // 피드의 실제 발행일만 사용 (없으면 '날짜 미확인')
        const report = buildReport(slug, live);

        DEDUPED_ARTICLES.push({
          id: DEDUPED_ARTICLES.length + 1,
          slug,
          rawUrl: (live && live.url) || `https://newsletter.semianalysis.com/p/${slug}`,
          title,
          titleEn: (live && live.title_ko && live.title) || '',
          categoryId,
          subName,
          publishDate,
          ...report,
          isBookmarked: false
        });
      }
    });

    /* 배포 전 필수 자동 검증 (5대 Integrity Self-Audit Engine) */
    function runIntegrityAudit() {
      const auditResults = [];
      const todayStr = new Date().toISOString().slice(0, 10);

      // Test 1: sum(카테고리별 건수) == 전체 건수
      const catCountMap = {};
      CATEGORIES.forEach(c => catCountMap[c.id] = 0);
      DEDUPED_ARTICLES.forEach(a => catCountMap[a.categoryId]++);
      const totalCatSum = Object.values(catCountMap).reduce((a, b) => a + b, 0);
      const test1Passed = (totalCatSum === DEDUPED_ARTICLES.length) && (DEDUPED_ARTICLES.length === RAW_SOURCE_LINES.length - duplicateCount);
      auditResults.push({
        id: "T1",
        title: "카테고리 건수 합계 일치",
        desc: `전체 합계: ${totalCatSum} == 순수 기사: ${DEDUPED_ARTICLES.length} (${DEDUPED_ARTICLES.length}건)`,
        passed: test1Passed
      });

      // Test 2: 모든 기사의 categoryId 가 5대 영역 ID 집합에 속함
      const categoryIdSet = new Set(CATEGORIES.map(c => c.id));
      let test2Passed = true;
      DEDUPED_ARTICLES.forEach(a => {
        if (!categoryIdSet.has(a.categoryId)) test2Passed = false;
      });
      auditResults.push({
        id: "T2",
        title: "카테고리 ID 집합 일치",
        desc: `대분류 ID(기타 포함) 100% 매핑`,
        passed: test2Passed
      });

      // Test 3: 동일 Insight 문단 쓰는 기사 비율 <= 5%
      const insightMap = {};
      DEDUPED_ARTICLES.filter(a => a.insights.length).forEach(a => {
        const textKey = a.insights.join(' ');
        insightMap[textKey] = (insightMap[textKey] || 0) + 1;
      });
      const insightCounts = Object.values(insightMap);
      const maxDuplicateInsight = insightCounts.length ? Math.max(...insightCounts) : 0;
      const duplicateInsightRatio = (maxDuplicateInsight / DEDUPED_ARTICLES.length) * 100;
      const test3Passed = duplicateInsightRatio <= 5.0;
      auditResults.push({
        id: "T3",
        title: "동일 Insight 비율 규정 준수",
        desc: `최대 중복 비율: ${(duplicateInsightRatio).toFixed(1)}% (기준: ≤5%)`,
        passed: test3Passed
      });

      // Test 4: 모든 publishDate <= 오늘
      let test4Passed = true;
      let dateViolationMsg = "";
      DEDUPED_ARTICLES.forEach(a => {
        if (a.publishDate) {
          if (a.publishDate > todayStr) {
            test4Passed = false;
            dateViolationMsg = `미래 날짜 위반: ${a.slug} (${a.publishDate})`;
          }
        }
      });
      auditResults.push({
        id: "T4",
        title: "발행일 오늘 이전 검증",
        desc: test4Passed ? "모든 날짜 ≤ 오늘" : dateViolationMsg,
        passed: test4Passed
      });

      // Test 5: 태그에 기호만 있는 값("&", "·") 금지
      let test5Passed = true;
      DEDUPED_ARTICLES.forEach(a => {
        a.tags.forEach(t => {
          if (/^[&·\/\-_+]+$/.test(t.trim()) || !t) test5Passed = false;
        });
      });
      auditResults.push({
        id: "T5",
        title: "단독 기호 태그 금지 검증",
        desc: "특수기호 단독 태그 0건",
        passed: test5Passed
      });

      return auditResults;
    }
    /* 애플리케이션 상태 */
    const PAGE_SIZE = 60; // 한 번에 렌더링하는 목록 행 수 ("더 보기"로 추가)
    const FRESH_MS = 7 * 24 * 3600 * 1000; // 발행 후 7일 이내 + 미읽음 = 최신 글(글로우)
    let state = {
      cat: 'all',
      sub: null,
      year: 'all',
      searchQuery: '',
      bookmarkedOnly: false,
      visibleCount: PAGE_SIZE,
      bookmarks: new Set(),
      read: new Set(),
      selected: null,
      activeModalArticle: null,   // 우측 상세 패널에 표시 중인 글 (상세 로더·Word·북마크가 참조)
      theme: 'light'
    };

    /* 기본 모드는 Light. 사용자가 고른 값만 저장해 다음 방문에도 유지 */
    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('semianalysis_theme'); } catch (e) { /* 저장소 차단 시 기본값 */ }
      state.theme = saved === 'dark' ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      updateThemeToggleUI();
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      try { localStorage.setItem('semianalysis_theme', state.theme); } catch (e) { /* 무시 */ }
      updateThemeToggleUI();
    }

    /* 버튼 라벨은 "전환될 모드" */
    function updateThemeToggleUI() {
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.textContent = state.theme === 'dark' ? '☀ Light' : '☾ Dark';
    }

    function initRead() {
      try { state.read = new Set(JSON.parse(localStorage.getItem('semianalysis_read') || '[]')); } catch (e) { state.read = new Set(); }
    }

    function saveRead() {
      try { localStorage.setItem('semianalysis_read', JSON.stringify([...state.read])); } catch (e) { /* 무시 */ }
    }

    function initBookmarks() {
      const stored = localStorage.getItem('semianalysis_bookmarks');
      if (stored) {
        try {
          const ids = JSON.parse(stored);
          state.bookmarks = new Set(ids);
          DEDUPED_ARTICLES.forEach(a => {
            if (state.bookmarks.has(a.id)) a.isBookmarked = true;
          });
        } catch (e) {
          console.error(e);
        }
      }
      updateBookmarkCount();
    }

    function saveBookmarks() {
      localStorage.setItem('semianalysis_bookmarks', JSON.stringify([...state.bookmarks]));
      updateBookmarkCount();
    }

    function updateBookmarkCount() {
      const el = document.getElementById('bookmarkCount');
      if (el) el.textContent = state.bookmarks.size;
    }
    /* ---------- 필터 판정: 카테고리 → 소분류 / 연도 / 북마크 / 검색어 ---------- */
    const passCat = a => state.cat === 'all' || (a.categoryId === state.cat && (!state.sub || a.subName === state.sub));
    const passYear = a => state.year === 'all' || (a.publishDate || '').startsWith(state.year);
    const passBm = a => !state.bookmarkedOnly || state.bookmarks.has(a.id);
    const hasQuery = () => !!state.searchQuery.trim();
    function passQuery(a) {
      const q = state.searchQuery.trim().toLowerCase();
      if (!q) return true;
      return a.title.toLowerCase().includes(q) ||
        (a.titleEn || '').toLowerCase().includes(q) ||
        a.summary.toLowerCase().includes(q) ||
        a.slug.toLowerCase().includes(q) ||
        a.insights.some(i => i.toLowerCase().includes(q)) ||
        a.tags.some(t => t.toLowerCase().includes(q));
    }
    const byDateDesc = (x, y) => (y.publishDate || '').localeCompare(x.publishDate || '');
    const isFresh = a => !!a.publishDate && (Date.now() - Date.parse(a.publishDate)) < FRESH_MS && !state.read.has(a.slug);

    function getFilteredArticles() {
      return DEDUPED_ARTICLES.filter(a => passCat(a) && passYear(a) && passBm(a) && passQuery(a)).sort(byDateDesc);
    }

    /* ---------- 좌측 사이드바 (카테고리 > 소분류, 연도) ---------- */
    /* 검색 중이면 "검색결과 / 전체"로 병기하고 0건은 흐리게 표시 (항목은 사라지지 않음) */
    const cnt = (hit, total) => hasQuery() ? `${hit}<i>/${total}</i>` : String(total);
    const navBtn = (attrs, label, hit, total, on, cls) =>
      `<button class="${cls || 'cat'} ${on ? 'on' : ''} ${hasQuery() && !hit ? 'zero' : ''}" ${attrs}><span>${esc(label)}</span><span class="n">${cnt(hit, total)}</span></button>`;

    function renderNav() {
      // 전체(total): 자기 축을 뺀 나머지 필터만 적용 / 검색결과(hit): 검색어까지 적용
      const totalCat = DEDUPED_ARTICLES.filter(a => passYear(a) && passBm(a));
      const hitCat = totalCat.filter(passQuery);
      const totalYear = DEDUPED_ARTICLES.filter(a => passCat(a) && passBm(a));
      const hitYear = totalYear.filter(passQuery);
      const tally = list => {
        const m = {}, sb = {};
        list.forEach(a => { m[a.categoryId] = (m[a.categoryId] || 0) + 1; const k = a.categoryId + '|' + a.subName; sb[k] = (sb[k] || 0) + 1; });
        return [m, sb];
      };
      const [tMain, tSub] = tally(totalCat), [hMain, hSub] = tally(hitCat);

      let h = '<h2>카테고리</h2>' + navBtn('data-c="all"', '전체', hitCat.length, totalCat.length, state.cat === 'all');
      CATEGORIES.filter(c => tMain[c.id]).forEach(c => {
        h += navBtn(`data-c="${c.id}"`, c.name, hMain[c.id] || 0, tMain[c.id], state.cat === c.id);
        if (state.cat === c.id && SUBS[c.id]) {
          [...SUBS[c.id].map(sb => sb.name), '기타']
            .filter(n => tSub[c.id + '|' + n])
            .forEach(n => { h += navBtn(`data-c="${c.id}" data-sub="${esc(n)}"`, n, hSub[c.id + '|' + n] || 0, tSub[c.id + '|' + n], state.sub === n, 'cat subcat'); });
        }
      });

      const yt = {}, yh = {};
      totalYear.forEach(a => { const y = (a.publishDate || '').slice(0, 4); if (y) yt[y] = (yt[y] || 0) + 1; });
      hitYear.forEach(a => { const y = (a.publishDate || '').slice(0, 4); if (y) yh[y] = (yh[y] || 0) + 1; });
      h += '<div class="sep"></div><h2>연도</h2><div class="yrs">' +
        `<button class="yr ${state.year === 'all' ? 'on' : ''}" data-year="all">전체</button>` +
        Object.keys(yt).sort().reverse().map(y =>
          `<button class="yr ${state.year === y ? 'on' : ''} ${hasQuery() && !yh[y] ? 'zero' : ''}" data-year="${y}">${y}<small>${cnt(yh[y] || 0, yt[y])}</small></button>`).join('') + '</div>';
      document.getElementById('nav').innerHTML = h;
    }

    /* ---------- 중앙 목록 ---------- */
    function renderList() {
      const items = getFilteredArticles();
      document.getElementById('count').textContent = items.length + '건';
      const filtered = state.cat !== 'all' || state.year !== 'all' || hasQuery() || state.bookmarkedOnly;
      document.getElementById('resetBtn').classList.toggle('hidden', !filtered);

      const list = document.getElementById('list');
      if (!items.length) {
        list.innerHTML = `<div class="none"><strong>일치하는 분석 리포트가 없습니다</strong>검색어나 카테고리 조건을 다시 확인해주세요.
          <button class="more" data-reset="1">필터 초기화</button></div>`;
        return;
      }
      const shown = items.slice(0, state.visibleCount);
      const remaining = items.length - shown.length;
      list.innerHTML = shown.map(a => {
        const cat = CATEGORIES.find(c => c.id === a.categoryId);
        const isBm = state.bookmarks.has(a.id);
        return `
          <div class="row ${a.slug === state.selected ? 'on' : ''} ${state.read.has(a.slug) ? 'read' : ''} ${isFresh(a) ? 'fresh' : ''}" data-s="${esc(a.slug)}">
            <div class="main">
              <div class="t">${esc(a.title)}</div>
              <div class="meta">${isFresh(a) ? '<span class="tag new">NEW</span>' : ''}<span class="tag">${esc(cat.name)}</span>${a.access === 'paywalled' ? '<span class="tag paid">유료</span>' : ''}<span>${a.publishDate || '날짜 미확인'}</span></div>
            </div>
            <button class="bm ${isBm ? 'on' : ''}" data-bm="${a.id}" title="${isBm ? '북마크 해제' : '북마크'}">${isBm ? '★' : '☆'}</button>
          </div>`;
      }).join('') + (remaining > 0 ? `<button class="more" id="loadMoreBtn">더 보기 (남은 ${remaining}건)</button>` : '');
    }

    function renderAll() {
      renderNav();
      renderList();
    }

    function loadMore() {
      state.visibleCount += PAGE_SIZE;
      renderList();
    }

    /* ---------- 글 선택: 목록 강조 + 우측 상세 패널 ---------- */
    function selectArticle(slug, opts) {
      const o = opts || {};
      state.selected = slug;
      if (!o.auto && !state.read.has(slug)) { state.read.add(slug); saveRead(); }
      renderList();
      showArticle(slug);
      if (o.scroll) {
        const el = document.querySelector('.row.on');
        if (el) el.scrollIntoView({ block: 'nearest' });
      }
    }

    const ACCESS_LABELS = { paywalled: '유료 구독', free: '무료', unknown: '접근 미확인' };

    function showArticle(slug) {
      const article = DEDUPED_ARTICLES.find(a => a.slug === slug);
      if (!article) return;

      state.activeModalArticle = article;
      const cat = CATEGORIES.find(c => c.id === article.categoryId);
      const subLabel = article.subName && article.subName !== '기타' ? ' · ' + article.subName : '';

      document.getElementById('modalCategory').textContent = cat.name + subLabel;
      document.getElementById('modalDate').textContent = article.publishDate || '날짜 미확인';
      document.getElementById('modalAccessBadge').textContent = ACCESS_LABELS[article.access] || article.access;
      document.getElementById('modalEvidenceBadge').textContent = EVIDENCE_LABELS[article.evidence];
      document.getElementById('modalTitle').textContent = article.title;
      const en = document.getElementById('modalTitleEn');
      en.textContent = article.titleEn;
      en.classList.toggle('hidden', !article.titleEn);

      const insightList = document.getElementById('modalInsightList');
      insightList.innerHTML = article.insights.map(item => `
        <li class="flex items-start gap-2">
          <span class="text-amber-500 font-bold select-none">•</span>
          <span>${esc(item.replace(/^[•\s]+/, ''))}</span>
        </li>
      `).join('');

      document.getElementById('modalInsightEvidence').textContent = EVIDENCE_LABELS[article.evidence];
      document.getElementById('modalInsightBox').classList.toggle('hidden', !article.insights.length);
      document.getElementById('modalExecutiveSummary').textContent = article.summary;

      document.getElementById('modalConclusion').textContent = article.conclusion;
      document.getElementById('modalConclusionBox').classList.toggle('hidden', !article.conclusion);
      document.getElementById('modalUrlText').textContent = article.rawUrl;
      document.getElementById('modalExternalLink').href = article.rawUrl;

      const tagsContainer = document.getElementById('modalTags');
      tagsContainer.innerHTML = article.tags.map(t => `
        <span class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-dark-bg text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-dark-border font-mono">#${esc(t)}</span>
      `).join('');

      updateModalBookmarkUI();

      // 상세(개요/상세/참고) 영역 초기화 후, 요약 JSON이 있으면 비동기 로드
      showModalDetail(null);
      document.getElementById('detailEmpty').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      document.getElementById('detailPane').scrollTop = 0;
      lucide.createIcons();
      loadModalDetail(article);
    }

    /* ---------- 우측 상세 패널(개요/상세/참고 탭) ---------- */
    const DETAIL_CACHE = {};
    const esc = (v) => String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    /* 상세 데이터 로더: <script>로 읽어 file://에서도 동작 (assets/summaries/<slug>.js -> window.POST_DETAIL[slug]) */
    function fetchDetail(slug) {
      if (DETAIL_CACHE[slug]) return Promise.resolve(DETAIL_CACHE[slug]);
      return new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = 'assets/summaries/' + encodeURIComponent(slug) + '.js';
        el.onload = () => {
          el.remove();
          const d = (window.POST_DETAIL || {})[slug];
          if (d) { DETAIL_CACHE[slug] = d; resolve(d); } else reject(new Error('no detail'));
        };
        el.onerror = () => { el.remove(); reject(new Error('load failed')); };
        document.head.appendChild(el);
      });
    }

    function loadModalDetail(article) {
      const live = POST_BY_SLUG[article.slug];
      if (!live || !live.has_detail) return;
      const show = (d) => {
        if (state.activeModalArticle && state.activeModalArticle.slug === article.slug) showModalDetail(d);
      };
      fetchDetail(article.slug).then(show).catch(() => { /* 실패 시 기본 보기 유지 */ });
    }

    function showModalDetail(d) {
      const legacy = document.getElementById('modalLegacy');
      const root = document.getElementById('modalDetail');
      const tabs = document.getElementById('modalTabs');
      if (!d) {
        legacy.classList.remove('hidden');
        root.classList.add('hidden');
        tabs.classList.add('hidden');
        tabs.classList.remove('flex');
        root.innerHTML = '';
        return;
      }
      const panels = {
        overview: renderOverviewPanel(d),
        detail: renderDetailPanel(d),
        ref: renderRefPanel(d)
      };
      root.innerHTML = Object.keys(panels).map(k =>
        `<div data-panel="${k}" class="space-y-7 hidden">${panels[k]}</div>`).join('');
      legacy.classList.add('hidden');
      root.classList.remove('hidden');
      tabs.classList.remove('hidden');
      tabs.classList.add('flex');
      setModalTab('overview');
      lucide.createIcons();
    }

    function setModalTab(name) {
      document.querySelectorAll('#modalTabs .modal-tab').forEach(b => {
        const on = b.dataset.tab === name;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.classList.toggle('border-emerald-500', on);
        b.classList.toggle('text-emerald-700', on);
        b.classList.toggle('dark:text-emerald-400', on);
        b.classList.toggle('border-transparent', !on);
        b.classList.toggle('text-slate-500', !on);
        b.classList.toggle('dark:text-slate-400', !on);
      });
      document.querySelectorAll('#modalDetail [data-panel]').forEach(p =>
        p.classList.toggle('hidden', p.dataset.panel !== name));
      document.getElementById('detailPane').scrollTop = 0;
    }

    /* 상세 패널 타이포: 본문 16px / 줄간격 28px(leading-7), 라벨·배지 14px, 섹션 제목 18px */
    const SEC_H = 'text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2.5 leading-7';
    const CARD = 'rounded-2xl border border-slate-200 dark:border-dark-border/80 bg-slate-50 dark:bg-dark-bg/60';
    const BODY_TXT = 'text-base leading-7 text-slate-700 dark:text-slate-200';

    function secBlock(icon, color, title, inner) {
      return `<section class="space-y-4">
        <h4 class="${SEC_H}"><i data-lucide="${icon}" class="w-5 h-5 shrink-0 ${color}"></i><span>${esc(title)}</span></h4>
        ${inner}</section>`;
    }

    /* [{label?, text}] -> 불릿(•) + 본문 문장. 라벨 박스는 쓰지 않고 본문만 표시한다 */
    function renderRows(items) {
      return `<ul class="space-y-3">` + items.filter(it => it.text).map(it =>
        `<li class="grid grid-cols-[1.25rem_minmax(0,1fr)] gap-x-2 items-start">
          <span class="h-7 flex items-center justify-center text-amber-500 font-bold select-none">•</span>
          <p class="${BODY_TXT}">${esc(it.text)}</p></li>`).join('') + `</ul>`;
    }

    function renderOverviewPanel(d) {
      let h = '';
      const keep = (d.meta || []).filter(m => /저자|수집/.test(m.k));
      if (keep.length) {
        h += `<div class="flex flex-wrap gap-x-6 gap-y-1.5 text-sm leading-6 text-slate-500 dark:text-slate-400">` +
          keep.map(m => `<span><span class="font-semibold text-slate-700 dark:text-slate-300">${esc(m.k)}</span> · ${esc(m.v)}</span>`).join('') + `</div>`;
      }
      if (d.summary && d.summary.length)
        h += secBlock('file-text', 'text-emerald-600 dark:text-emerald-400', '요약 (Executive Summary)', `<div class="${CARD} p-5 sm:p-6">${renderRows(d.summary)}</div>`);
      if (d.insights && d.insights.length) {
        const cards = d.insights.map((ins, i) => {
          const title = (ins.tag ? `[${ins.tag}] ` : '') + ins.title;
          return `<article class="rounded-2xl border border-emerald-300 dark:border-emerald-500/30 bg-emerald-50/60 dark:bg-emerald-950/20 p-5 sm:p-6">
            <h5 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white leading-snug mb-4">${i + 1}. ${esc(title)}</h5>
            ${renderRows(ins.items || [])}</article>`;
        }).join('');
        h += secBlock('lightbulb', 'text-amber-500', '핵심 인사이트', `<div class="space-y-4">${cards}</div>`);
      }
      if (d.conclusion && d.conclusion.length)
        h += secBlock('compass', 'text-purple-600 dark:text-purple-400', '결론 (Conclusion)', `<div class="${CARD} p-5 sm:p-6">${renderRows(d.conclusion)}</div>`);
      return h || `<p class="text-base text-slate-500 dark:text-slate-400">이 글에는 개요 항목이 없습니다.</p>`;
    }

    /* 표 렌더: 박스/배지 없이 텍스트만. 셀 정렬은 위쪽 기준, 줄간격 28px */
    function renderTable(t) {
      if (!t || !t.rows || !t.rows.length) return '';
      const head = t.head.map(c => `<th class="px-4 py-3 text-sm font-semibold leading-5 whitespace-nowrap">${esc(c)}</th>`).join('');
      const body = t.rows.map(r => `<tr class="align-top">` + r.map((c, i) => {
        const cls = i === 0 ? 'font-semibold text-slate-900 dark:text-white' : 'text-slate-700 dark:text-slate-300';
        return `<td class="px-4 py-3.5 text-base leading-7 ${cls}">${esc(c)}</td>`;
      }).join('') + `</tr>`).join('');
      return `<div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-dark-border/80">
        <table class="w-full text-left">
          <thead class="bg-slate-100 dark:bg-dark-bg/80 text-slate-500 dark:text-slate-400"><tr>${head}</tr></thead>
          <tbody class="divide-y divide-slate-200 dark:divide-dark-border/60">${body}</tbody>
        </table></div>`;
    }

    function renderDetailPanel(d) {
      let h = '';
      if (d.metrics && d.metrics.rows && d.metrics.rows.length)
        h += secBlock('bar-chart-3', 'text-emerald-600 dark:text-emerald-400', '핵심 수치', renderTable(d.metrics), d.metrics.rows.length);
      if (d.topics && d.topics.length) {
        const cards = d.topics.map(t => `<article class="${CARD} p-5 sm:p-6">
            <h5 class="text-lg font-bold leading-snug text-slate-900 dark:text-white mb-4">${esc(t.title)}</h5>
            ${renderRows(t.items || [])}</article>`).join('');
        h += secBlock('layers', 'text-sky-600 dark:text-sky-400', '주제별 요약', `<div class="space-y-4">${cards}</div>`, d.topics.length);
      }
      if (d.views && d.views.length)
        h += secBlock('microscope', 'text-purple-600 dark:text-purple-400', '기술 관점', `<div class="${CARD} p-5 sm:p-6">${renderRows(d.views)}</div>`);
      return h || `<p class="text-base text-slate-500 dark:text-slate-400">이 글에는 상세 항목이 없습니다.</p>`;
    }

    function renderRefPanel(d) {
      let h = '';
      if (d.limits && d.limits.length) {
        const li = d.limits.map((x, i) => `<li class="grid grid-cols-[1.75rem_minmax(0,1fr)] items-start">
            <span class="${BODY_TXT} font-mono font-bold !text-amber-600 dark:!text-amber-400">${i + 1}.</span>
            <span class="${BODY_TXT}">${esc(x)}</span></li>`).join('');
        h += secBlock('alert-triangle', 'text-amber-500', '한계 및 주의점',
          `<ol class="space-y-3 rounded-2xl border border-amber-300 dark:border-amber-500/30 bg-amber-50/70 dark:bg-amber-950/20 p-5 sm:p-6">${li}</ol>`, d.limits.length);
      }
      if (d.todos && d.todos.length) {
        const li = d.todos.map(t => `<li class="grid grid-cols-[1.75rem_minmax(0,1fr)] items-start">
              <span class="h-7 flex items-center"><i data-lucide="${t.done ? 'check-square' : 'square'}" class="w-5 h-5 ${t.done ? 'text-emerald-500' : 'text-slate-400'}"></i></span>
              <span class="${BODY_TXT}">${esc(t.text)}</span></li>`).join('');
        h += secBlock('list-checks', 'text-emerald-600 dark:text-emerald-400', '후속 확인 과제', `<ul class="space-y-3 ${CARD} p-5 sm:p-6">${li}</ul>`, d.todos.length);
      }
      if (d.glossary && d.glossary.rows && d.glossary.rows.length)
        h += secBlock('book-open', 'text-sky-600 dark:text-sky-400', '용어집', renderTable(d.glossary), d.glossary.rows.length);
      return h || `<p class="text-base text-slate-500 dark:text-slate-400">이 글에는 참고 항목이 없습니다.</p>`;
    }

    /* ---------- Word(.docx) 다운로드: 상세 패널의 개요/상세/참고 전체를 OOXML로 직접 생성(외부 라이브러리 없음) ---------- */
    const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

    /* 문서 블록 구성: {k:'h1|h2|h3|h4|meta|p|ul|ol|todo|table', ...} */
    function buildWordBlocks(article, d) {
      const cat = CATEGORIES.find(c => c.id === article.categoryId);
      const B = [];
      B.push({ k: 'h1', t: article.title });
      B.push({ k: 'meta', t: [cat ? cat.name : '', article.publishDate ? '발행일 ' + article.publishDate : '발행일 미확인', article.access].filter(Boolean).join(' · ') });
      B.push({ k: 'meta', t: '원문: ' + article.rawUrl });
      if (!d) {  // 상세 JSON이 없는 글: 기본 보기(핵심 포인트·요약·한 줄 요점)
        if (article.insights.length) { B.push({ k: 'h2', t: '핵심 포인트' }); B.push({ k: 'ul', items: article.insights.map(s => s.replace(/^[•\s]+/, '')) }); }
        B.push({ k: 'h2', t: '요약' }); B.push({ k: 'p', t: article.summary });
        if (article.conclusion) { B.push({ k: 'h2', t: '한 줄 요점' }); B.push({ k: 'p', t: article.conclusion }); }
        return B;
      }
      const txt = (arr) => (arr || []).map(i => i.text).filter(Boolean);
      (d.meta || []).filter(m => /저자|수집/.test(m.k)).forEach(m => B.push({ k: 'meta', t: m.k + ': ' + m.v }));

      B.push({ k: 'h2', t: '개요' });
      if (d.summary && d.summary.length) { B.push({ k: 'h3', t: '요약 (Executive Summary)' }); B.push({ k: 'ul', items: txt(d.summary) }); }
      if (d.insights && d.insights.length) {
        B.push({ k: 'h3', t: '핵심 인사이트' });
        d.insights.forEach((ins, i) => {
          B.push({ k: 'h4', t: `${i + 1}. ${ins.tag ? '[' + ins.tag + '] ' : ''}${ins.title}` });
          B.push({ k: 'ul', items: txt(ins.items) });
        });
      }
      if (d.conclusion && d.conclusion.length) { B.push({ k: 'h3', t: '결론 (Conclusion)' }); B.push({ k: 'ul', items: txt(d.conclusion) }); }

      B.push({ k: 'h2', t: '상세' });
      if (d.metrics && d.metrics.rows && d.metrics.rows.length) { B.push({ k: 'h3', t: '핵심 수치' }); B.push({ k: 'table', head: d.metrics.head, rows: d.metrics.rows }); }
      if (d.topics && d.topics.length) {
        B.push({ k: 'h3', t: '주제별 요약' });
        d.topics.forEach(t => { B.push({ k: 'h4', t: t.title }); B.push({ k: 'ul', items: txt(t.items) }); });
      }
      if (d.views && d.views.length) { B.push({ k: 'h3', t: '기술 관점' }); B.push({ k: 'ul', items: txt(d.views) }); }

      B.push({ k: 'h2', t: '참고' });
      if (d.limits && d.limits.length) { B.push({ k: 'h3', t: '한계 및 주의점' }); B.push({ k: 'ol', items: d.limits }); }
      if (d.todos && d.todos.length) { B.push({ k: 'h3', t: '후속 확인 과제' }); B.push({ k: 'todo', items: d.todos }); }
      if (d.glossary && d.glossary.rows && d.glossary.rows.length) { B.push({ k: 'h3', t: '용어집' }); B.push({ k: 'table', head: d.glossary.head, rows: d.glossary.rows }); }
      return B;
    }

    const xesc = (s) => String(s == null ? '' : s)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const wRun = (t, rpr) => `<w:r>${rpr ? `<w:rPr>${rpr}</w:rPr>` : ''}<w:t xml:space="preserve">${xesc(t)}</w:t></w:r>`;
    const wPara = (t, ppr, rpr) => `<w:p>${ppr ? `<w:pPr>${ppr}</w:pPr>` : ''}${wRun(t, rpr)}</w:p>`;

    function wTable(head, rows) {
      const cell = (t, hdr) => `<w:tc><w:tcPr>${hdr ? '<w:shd w:val="clear" w:color="auto" w:fill="E2E8F0"/>' : ''}</w:tcPr>`
        + wPara(t, '<w:spacing w:before="40" w:after="40"/>', hdr ? '<w:b/>' : '') + `</w:tc>`;
      const bd = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV']
        .map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="94A3B8"/>`).join('');
      return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${bd}</w:tblBorders>`
        + `<w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>`
        + `<w:tr><w:trPr><w:tblHeader/></w:trPr>${head.map(c => cell(c, true)).join('')}</w:tr>`
        + rows.map(r => `<w:tr>${r.map(c => cell(c, false)).join('')}</w:tr>`).join('')
        + `</w:tbl><w:p/>`;
    }

    function wordDocumentXml(blocks) {
      const body = blocks.map(b => {
        switch (b.k) {
          case 'h1': return wPara(b.t, '<w:pStyle w:val="Heading1"/>');
          case 'h2': return wPara(b.t, '<w:pStyle w:val="Heading2"/>');
          case 'h3': return wPara(b.t, '<w:pStyle w:val="Heading3"/>');
          case 'h4': return wPara(b.t, '<w:pStyle w:val="Heading4"/>');
          case 'meta': return wPara(b.t, '<w:spacing w:after="40"/>', '<w:color w:val="64748B"/><w:sz w:val="19"/>');
          case 'p': return wPara(b.t, '<w:spacing w:after="120"/>');
          case 'ul': return b.items.map(t => wPara(t, '<w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>')).join('');
          case 'ol': return b.items.map((t, i) => wPara(`${i + 1}. ${t}`, '<w:pStyle w:val="ListParagraph"/><w:ind w:left="420" w:hanging="320"/>')).join('');
          case 'todo': return b.items.map(it => wPara(`${it.done ? '☑' : '☐'} ${it.text}`, '<w:pStyle w:val="ListParagraph"/><w:ind w:left="420" w:hanging="320"/>')).join('');
          case 'table': return wTable(b.head, b.rows);
          default: return '';
        }
      }).join('');
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
        + `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}`
        + `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>`
        + `</w:body></w:document>`;
    }

    const DOCX_STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Malgun Gothic" w:cs="Arial"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-US" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault>
<w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="336" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="0" w:after="120"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:sz w:val="40"/><w:szCs w:val="40"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="059669"/></w:pBdr><w:spacing w:before="360" w:after="120"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:sz w:val="30"/><w:szCs w:val="30"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="80"/><w:outlineLvl w:val="2"/></w:pPr><w:rPr><w:b/><w:color w:val="047857"/><w:sz w:val="25"/><w:szCs w:val="25"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading4"><w:name w:val="heading 4"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="160" w:after="40"/><w:outlineLvl w:val="3"/></w:pPr><w:rPr><w:b/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="60"/></w:pPr></w:style>
</w:styles>`;

    const DOCX_NUMBERING = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="420" w:hanging="260"/></w:pPr><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:hint="default"/></w:rPr></w:lvl></w:abstractNum>
<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>
</w:numbering>`;

    const DOCX_FILES = {
      '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>`,
      '_rels/.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
      'word/_rels/document.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>`,
      'word/styles.xml': DOCX_STYLES,
      'word/numbering.xml': DOCX_NUMBERING
    };

    /* 무압축(STORE) ZIP 생성기 */
    const CRC_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
      return t;
    })();
    function crc32(u8) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }
    function zipStore(files) {  // files: [{name, data(Uint8Array)}]
      const enc = new TextEncoder();
      const now = new Date();
      const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
      const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
      const parts = [], central = [];
      let offset = 0;
      files.forEach(f => {
        const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
        lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
        lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
        lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
        parts.push(new Uint8Array(lh.buffer), name, f.data);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
        ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
        ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
        ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
        central.push(new Uint8Array(ch.buffer), name);
        offset += 30 + name.length + size;
      });
      const cdSize = central.reduce((n, p) => n + p.length, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
      return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: DOCX_MIME });
    }

    function buildDocxBlob(article, d) {
      const enc = new TextEncoder();
      const files = Object.entries(DOCX_FILES).map(([name, xml]) => ({ name, data: enc.encode(xml) }));
      files.push({ name: 'word/document.xml', data: enc.encode(wordDocumentXml(buildWordBlocks(article, d))) });
      return zipStore(files);
    }

    async function downloadModalWord() {
      const article = state.activeModalArticle;
      if (!article) return;
      let d = DETAIL_CACHE[article.slug] || null;
      const live = POST_BY_SLUG[article.slug];
      if (!d && live && live.has_detail) {  // 아직 로드 전이면 가져온다
        try { d = await fetchDetail(article.slug); } catch (e) { /* 기본 내용으로 저장 */ }
      }
      const blob = buildDocxBlob(article, d);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${article.publishDate || 'undated'}_${article.slug}.docx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      showToast('Word 문서(.docx)를 저장했습니다.');
    }

    function updateModalBookmarkUI() {
      if (!state.activeModalArticle) return;
      const isBm = state.bookmarks.has(state.activeModalArticle.id);
      const label = document.getElementById('modalBookmarkLabel');
      const btn = document.getElementById('modalBookmarkBtn');

      if (isBm) {
        label.textContent = '북마크 해제';
        btn.classList.add('text-amber-500', 'border-amber-400');
      } else {
        label.textContent = '북마크 추가';
        btn.classList.remove('text-amber-500', 'border-amber-400');
      }
    }

    function toggleModalBookmark() {
      if (!state.activeModalArticle) return;
      toggleBookmark(state.activeModalArticle.id);
    }

    function toggleBookmark(id, event) {
      if (event) event.stopPropagation();
      const article = DEDUPED_ARTICLES.find(a => a.id === id);
      if (!article) return;

      if (state.bookmarks.has(id)) {
        state.bookmarks.delete(id);
        article.isBookmarked = false;
        showToast('북마크에서 제거되었습니다.');
      } else {
        state.bookmarks.add(id);
        article.isBookmarked = true;
        showToast('북마크에 저장되었습니다.');
      }
      saveBookmarks();
      renderAll();
      updateModalBookmarkUI();
    }

    function copyModalUrl() {
      if (!state.activeModalArticle) return;
      copyToClipboard(state.activeModalArticle.rawUrl);
    }

    function copyToClipboard(text, event) {
      if (event) event.stopPropagation();
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('URL이 클립보드에 복사되었습니다.');
      } catch (err) {
        showToast('복사에 실패했습니다.');
      }
      document.body.removeChild(textArea);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    function handleSearch(val) {
      state.searchQuery = val;
      state.visibleCount = PAGE_SIZE;
      renderAll();
    }

    function toggleBookmarkOnlyFilter() {
      state.bookmarkedOnly = !state.bookmarkedOnly;
      document.getElementById('bookmarkFilterBtn').classList.toggle('on', state.bookmarkedOnly);
      state.visibleCount = PAGE_SIZE;
      renderAll();
    }

    /* 검색어·카테고리·소분류·연도·북마크 필터를 모두 해제 */
    function resetAllFilters() {
      state.searchQuery = '';
      state.cat = 'all';
      state.sub = null;
      state.year = 'all';
      state.bookmarkedOnly = false;
      state.visibleCount = PAGE_SIZE;
      document.getElementById('searchInput').value = '';
      document.getElementById('bookmarkFilterBtn').classList.remove('on');
      renderAll();
    }

    function exportMarkdownSummary() {
      const activeList = getFilteredArticles();
      let md = `# SemiAnalysis 기술 인텔리전스 총괄 리포트\n`;
      md += `> 생성일: ${new Date().toISOString().slice(0, 10)} | 총 분석 건수: ${activeList.length}건\n\n`;
      md += `---\n\n`;

      activeList.forEach((a, i) => {
        const cat = CATEGORIES.find(c => c.id === a.categoryId);
        md += `## ${i + 1}. ${a.title}\n`;
        md += `- **원문 링크**: ${a.rawUrl}\n`;
        md += `- **카테고리**: ${cat.name}\n`;
        md += `- **발행일**: ${a.publishDate ? a.publishDate : '날짜 미확인'}\n`;
        md += `- **출처 구분**: ${EVIDENCE_LABELS[a.evidence]} / ${a.access}\n\n`;

        if (a.insights.length) {
          md += `### 💡 핵심 포인트\n`;
          a.insights.forEach(ins => md += `- ${ins}\n`);
          md += `\n`;
        }

        md += `### 📋 요약\n${a.summary}\n\n`;
        if (a.conclusion) md += `### 🎯 한 줄 요점\n${a.conclusion}\n\n`;
        md += `**태그**: ${a.tags.map(t => `#${t}`).join(' ')}\n\n`;
        md += `---\n\n`;
      });

      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `SemiAnalysis_Verified_Reports_${Date.now()}.md`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast(`${activeList.length}건의 리포트가 마크다운으로 다운로드되었습니다.`);
    }
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initBookmarks();
      initRead();

      // 데이터 정합성 자동 점검 (화면 표시 없음, 실패 시 콘솔 경고)
      const failed = runIntegrityAudit().filter(r => !r.passed);
      if (failed.length) console.warn('[무결성 점검 실패]', failed.map(f => `${f.id} ${f.title}: ${f.desc}`));

      if (!USING_LIVE_DATA) document.getElementById('dataError').classList.remove('hidden');

      // 사이드바: 카테고리 / 소분류 / 연도
      document.getElementById('nav').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const d = b.dataset;
        if (d.c !== undefined) {
          if (d.sub) state.sub = state.sub === d.sub ? null : d.sub;
          else { state.sub = null; state.cat = d.c; }
        } else if (d.year) {
          state.year = d.year;
        } else {
          return;
        }
        state.visibleCount = PAGE_SIZE;
        renderAll();
      });

      // 목록: 북마크 / 더 보기 / 필터 초기화 / 글 선택
      document.getElementById('list').addEventListener('click', (e) => {
        const bm = e.target.closest('[data-bm]');
        if (bm) { toggleBookmark(Number(bm.dataset.bm), e); return; }
        if (e.target.closest('#loadMoreBtn')) { loadMore(); return; }
        if (e.target.closest('[data-reset]')) { resetAllFilters(); return; }
        const row = e.target.closest('[data-s]');
        if (row) selectArticle(row.dataset.s);
      });

      // 키보드: / 검색, J·K(↑↓) 이동, Enter 원문, Esc 검색어 지우기
      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const q = document.getElementById('searchInput');
        if (document.activeElement === q) {
          if (e.key === 'Escape') {
            if (q.value) { q.value = ''; handleSearch(''); } else q.blur();
          }
          return;
        }
        if (e.key === '/') { e.preventDefault(); q.focus(); return; }
        const tag = document.activeElement && document.activeElement.tagName;
        const items = getFilteredArticles().slice(0, state.visibleCount);
        const i = items.findIndex(a => a.slug === state.selected);
        if (e.key === 'j' || e.key === 'ArrowDown') {
          e.preventDefault();
          const n = items[Math.min(i + 1, items.length - 1)];
          if (n) selectArticle(n.slug, { scroll: true });
        } else if (e.key === 'k' || e.key === 'ArrowUp') {
          e.preventDefault();
          const n = items[Math.max(i - 1, 0)];
          if (n) selectArticle(n.slug, { scroll: true });
        } else if (e.key === 'Enter' && i >= 0 && tag !== 'BUTTON' && tag !== 'A') {
          window.open(items[i].rawUrl, '_blank', 'noopener');
        }
      });

      renderAll();
      // 첫 화면: 최신 글을 상세 패널에 표시 (읽음 처리는 하지 않아 NEW가 유지됨)
      const first = getFilteredArticles()[0];
      if (first) { state.selected = first.slug; renderList(); showArticle(first.slug); }
    });
  </script>
</body>
</html>
